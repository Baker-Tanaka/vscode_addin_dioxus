[package]
name = "hello-vscode-dioxus-app"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.1", features = ["web"] }
dioxus-web = "0.7.1"
wasm-bindgen = "0.2.95"
serde-wasm-bindgen = "0.6.5"
web-sys = { version = "0.3.72", features = ["Window"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.132"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
